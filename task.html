<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 800px;
            height: 850px;
            position: relative;
        }

        .card {
            width: 300px;
            height: 400px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            position: absolute;
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
            z-index: 1;
        }

        .card:nth-child(1) {
            left: 0;
            top: 0;
            z-index: 3;
        }

        .card:nth-child(2) {
            left: 90px;
            top: 165px;
            z-index: 2;
        }

        .card:nth-child(3) {
            left: 220px;
            top: 365px;
            z-index: 1;
        }

        .card:nth-child(1):hover {
            transform: translateY(-40px) scale(1.1) rotate(360deg);
            z-index: 100;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .card:nth-child(2):hover {
            transform: translateY(-40px) scale(1.1) skew(-15deg, -10deg);
            z-index: 100;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .card:nth-child(3):hover {
            transform: translateY(-100px) translateX(100px) scale(1.03);
            z-index: 100;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.8),
                transparent
            );
            padding: 20px;
            color: white;
        }

        .card-content h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .card-content p {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <img
                src="https://i.pinimg.com/736x/5c/1f/9b/5c1f9be35142790c0eeab198f27915bb.jpg"
                alt="Aizen"
            >

            <div class="card-content">
                <h2>SHRI MODI JI</h2>
                <p>SHERE-E-HINDUSTAN</p>
            </div>
        </div>

        <div class="card">
            <img
                src="https://i.pinimg.com/736x/bc/2b/fb/bc2bfb4fe3a0e31bafa63fccde0a649d.jpg"
                alt="Zoro"
            >

            <div class="card-content">
                <h2>SHRI AMIT SHAH JI</h2>
                <p>JAAN DE DENGE ISKE LIYE</p>
            </div>
        </div>

        <div class="card">
            <img
                src="https://i.pinimg.com/736x/16/4d/0c/164d0c74bcf8e0bd766649781453839e.jpg"
                alt="Sanji"
            >

            <div class="card-content">
                <h2>SHRI YOGI JI</h2>
                <p>MAFIAON KO MITTI ME MILA DENGE</p>
            </div>
        </div>

    </div>

</body>
</html>
