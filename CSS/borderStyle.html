<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1{
            border-bottom: 5px solid yellow;
            text-align: center;
            margin: 20px;
            font-size: 20px;
        }
        #solid{
            border: 5px solid red;
            height: 100px;
            width: 100%;
            text-align: center;
            margin: 20px;
            font-size: 20px;
        }
        #dotted{
            border: 5px dotted blue;
            height: 100px;
            width: 100%;
            text-align: center;
            margin: 20px;
            font-size: 20px;
        }
        #dashed{
            border: 5px dashed green;
            height: 100px;
            width: 100%;
            text-align: center;
            margin: 20px;
            font-size: 20px;
        }
        #double{
            border: 5px double purple;
            height: 100px;
            width: 100%;
            text-align: center;
            margin: 20px;
            font-size: 20px;
        }
        #inset{
            border: 5px inset orange;
            height: 100px;
            width: 100%;
            text-align: center;
            margin: 20px;
            font-size: 20px;
        }
        #outset{
            border: 5px outset pink;
            height: 100px;
            width: 100%;
            text-align: center;
            margin: 20px;
            font-size: 20px;
        }
    </style>


</head>
<body>
    <h1>Border Style</h1>
    <div id="solid">Solid Border</div>
    <div id="dotted">Dotted Border</div>
    <div id="dashed">Dashed Border</div>
    <div id="double">Double Border</div>
    <div id="inset">Inset Border</div>
    <div id="outset">Outset Border</div>
</body>
</html>
