<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .styled-div {
            width: 300px;
            height: 200px;
            background-color: yellow;
            border: 2px solid black;
            border-radius: 8px;
            padding: 20px;
            margin: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .circle-div {
            width: 200px;
            height: 200px;
            background-color: #ff6b6b;
            border: 3px solid #c92a2a;
            border-radius: 50%;
            padding: 20px;
            margin: 20px;
            box-shadow: 0 6px 12px rgba(255, 107, 107, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .rectangle-div {
            width: 400px;
            height: 150px;
            background-color: #4dabf7;
            border: 2px solid #1971c2;
            border-radius: 5px;
            padding: 20px;
            margin: 20px;
            box-shadow: 0 4px 8px rgba(77, 171, 247, 0.2);
        }
        
        .leaf-div {
            width: 150px;
            height: 200px;
            background: linear-gradient(135deg, #51cf66 0%, #2f9e44 100%);
            border: 2px solid #2b8a3e;
            border-radius: 0 100% 100% 0;
            padding: 20px;
            margin: 20px;
            box-shadow: 0 5px 10px rgba(47, 158, 68, 0.3);
            position: relative;
        }
        
        .triangle-div {
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 180px solid #f59f00;
            margin: 20px;
            filter: drop-shadow(0 4px 6px rgba(245, 159, 0, 0.3));
        }
        
        .diamond-div {
            width: 150px;
            height: 150px;
            background-color: #da77f2;
            border: 2px solid #9c36b5;
            margin: 20px;
            transform: rotate(45deg);
            box-shadow: 0 6px 12px rgba(218, 119, 242, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .diamond-div span {
            transform: rotate(-45deg);
        }
    </style>
</head>
<body>
    <div class="styled-div">
        This is a styled div element
    </div>
    
    <div class="circle-div">
        Circle Shape
    </div>
    
    <div class="rectangle-div">
        Rectangle Shape
    </div>
    
    <div class="leaf-div">
        Leaf Shape
    </div>
    
    <div class="triangle-div"></div>
    
    <div class="diamond-div">
        <span>Diamond</span>
    </div>
</body>
</html>
